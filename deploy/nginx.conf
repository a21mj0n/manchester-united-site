# Nginx reverse proxy — manchester-united.uz
# O'rnatish:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/manchester-united.uz
#   sudo ln -s /etc/nginx/sites-available/manchester-united.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS sertifikatini certbot o'zi qo'shadi:
#   sudo certbot --nginx -d manchester-united.uz -d www.manchester-united.uz

server {
    listen 80;
    listen [::]:80;
    server_name manchester-united.uz www.manchester-united.uz;

    # certbot HTTPS blokini shu yerga o'zi qo'shadi va HTTP ni redirect qiladi

    client_max_body_size 2m;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Next.js hash bilan nomlangan fayllari — uzoq muddat keshlanadi
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Jamoa gerblari — sinxronizatsiya yuklab qo'yadi.
    # Reliz papkasidan tashqarida, shuning uchun deploy ularga tegmaydi.
    location /badges/ {
        alias /var/www/manchester-united-site/data/badges/;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff";
        # SVG to'g'ridan-to'g'ri ochilsa skript ishlamasin
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'";
        try_files $uri =404;
    }

    # Rasm va emblemalar
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }
}
